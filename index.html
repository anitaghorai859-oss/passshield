<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Security - Password Health Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 {
      color: #0d6efd;
      font-size: 20px;
      margin-bottom: 15px;
      text-align: center;
    }
    label {
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 2px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    .warning {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      display: none;
      font-size: 14px;
    }
    .unsafe {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .safe {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Password Security Checker</h2>
    <label for="password">Enter Your Password:</label>
    <input type="text" id="password" placeholder="Type password here..." oninput="checkPassword()">
    
    <div id="result" class="warning"></div>
  </div>

  <script>
    function checkPassword() {
      let pass = document.getElementById("password").value;
      let resultDiv = document.getElementById("result");

      // Common weak patterns (predictable numbers, years, and words)
      let weakPatterns = ["123456", "password", "admin", "017", "018", "019", "013", "014", "015", "016", "2008", "2009", "2010", "2011", "2012"];

      if (pass === "") {
        resultDiv.style.display = "none";
        return;
      }

      let isWeak = false;

      // Check for minimum length
      if (pass.length < 8) {
        resultDiv.className = "warning unsafe";
        resultDiv.innerText = "❌ Too short! Use at least 8 characters.";
        resultDiv.style.display = "block";
        return;
      }

      // Check for weak patterns
      for (let pattern of weakPatterns) {
        if (pass.toLowerCase().includes(pattern)) {
          isWeak = true;
          break;
        }
      }

      if (isWeak) {
        resultDiv.className = "warning unsafe";
        resultDiv.innerText = "⚠️ Warning: Avoid names, phone numbers, or birth years. Easy to guess!";
        resultDiv.style.display = "block";
      } else {
        resultDiv.className = "warning safe";
        resultDiv.innerText = "✅ Strong Password! This looks safe and secure.";
        resultDiv.style.display = "block";
      }
    }
  </script>

</body>
</html>
